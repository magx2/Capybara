name: Branch Build & Check

on:
  push:
    branches:
      - "**"
      - "!master"
      - "!release/**"
      - "!merge-back/**"
    paths:
      - ".github/workflows/**"
      - "build-tool/**"
      - "buildSrc/**"
      - "capy/**"
      - "gradle/**"
      - "lib/**"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew clean compileJava --no-daemon
